name: Check Archived Repositories

on:
  schedule:
    - cron: '0 0 * * 0,2,4'  # Sun/Tue/Thu at 00:00 UTC
  workflow_dispatch:

jobs:
  check-archives:
    runs-on: macos-14

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore repository cache
        uses: actions/cache@v5
        with:
          path: .cache.json
          key: archive-bot-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            archive-bot-${{ runner.os }}-

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10.1"

      - name: Build archive-bot
        run: swift build -c release

      - name: Run archive-bot
        run: .build/release/archive-bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push README changes
        shell: bash
        run: |
          git config user.name 'archive-bot'
          git config user.email 'archive-bot@users.noreply.github.com'
          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m '[auto][ci]: update archived repositories status'

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
